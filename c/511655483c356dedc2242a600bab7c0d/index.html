<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, noai, noimageai">
<title>Dinha Mais · Acompanhamento MK3</title>
<style>:root{--bg:#140E24;--panel:#241A3D;--panel2:#2E2249;--line:#40325F;--txt:#F1EEFB;--mut:#B9B0D2;
 --mk3:#8B5CF6;--mk3o:#F97316;--atrasado:#F2555A;--hoje:#FF8A3D;--umdia:#F5C518;--ok:#4CC463}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-color:#3E3060 transparent;scrollbar-width:thin}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#3E3060;border-radius:20px;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:#584578;border:2px solid transparent;background-clip:content-box}
body{background:var(--bg);color:var(--txt);line-height:1.55;padding:28px 18px 60px;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.marca{font-size:20px;font-weight:800;letter-spacing:-.02em}
.marca span{color:var(--mk3o)}
.hoje{font-size:12.5px;color:var(--mut)}
h1{font-size:24px;letter-spacing:-.02em;margin-bottom:18px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);font-weight:700;margin-bottom:12px}
h3.sub{font-size:13px;font-weight:600;color:var(--txt);margin:20px 0 4px}
.bloco{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px;
 box-shadow:0 2px 10px rgba(0,0,0,.28)}
.bloco.ok h2{color:var(--ok)}
.bloco p{font-size:13.5px;color:var(--mut)}
.item{background:var(--panel2);border-left:3px solid var(--mut);border-radius:9px;padding:12px 14px;margin-bottom:9px}
.i-t{font-size:15px;font-weight:600}
.i-m{font-size:12.5px;color:var(--mut);margin-top:2px}
.i-atrasado{border-left-color:var(--atrasado);background:rgba(242,85,90,.10)}
.i-hoje{border-left-color:var(--hoje);background:rgba(255,138,61,.10)}
.i-umdia{border-left-color:var(--umdia);background:rgba(245,197,24,.10)}
.i-ok{border-left-color:var(--mk3)}
.nota{font-size:12px;color:var(--mut);margin-top:10px;font-style:italic}
.linha-lista{display:flex;flex-direction:column}
.ln{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px dashed var(--line);font-size:14px}
.ln:first-child{border-top:none}
.ln-d{color:var(--mut);font-size:12.5px;width:62px;flex:none;font-variant-numeric:tabular-nums}
.ln-t{flex:1;min-width:0}
.ln-q{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:20px;flex:none}
.ln-q.cli{background:rgba(245,197,24,.15);color:var(--umdia)}
.ln-q.mk3{background:rgba(139,92,246,.18);color:#C4B5FD}
.tl{display:flex;flex-direction:column;position:relative;padding-left:16px}
.tl::before{content:"";position:absolute;left:3px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl-i{position:relative;padding:6px 0;font-size:13.5px;display:flex;gap:12px}
.tl-i::before{content:"";position:absolute;left:-16px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--mk3)}
.tl-d{color:var(--mut);font-size:12.5px;width:62px;flex:none;font-variant-numeric:tabular-nums}
.tl-t i{font-style:normal;color:var(--mut);font-size:12.5px}
.atr{background:rgba(242,85,90,.08);border:1px solid rgba(242,85,90,.25);border-radius:9px;padding:12px 14px;margin-top:10px}
.atr.aberto{background:rgba(255,138,61,.09);border-color:rgba(255,138,61,.3)}
.atr.aberto .a-m b{color:#FFC08A}
.tagx{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:rgba(255,138,61,.2);
 color:#FFC08A;padding:2px 8px;border-radius:20px;vertical-align:middle;margin-left:6px}
.a-t{font-size:14.5px;font-weight:600}
.a-m{font-size:12.5px;color:var(--mut);margin-top:3px}
.a-m b{color:#FF9DA0}
.a-e{font-size:12.5px;color:var(--mut);margin-top:6px;padding-top:6px;border-top:1px dashed rgba(242,85,90,.25)}
.ok-box{background:rgba(76,196,99,.10);border:1px solid rgba(76,196,99,.3);color:#A6E9B4;border-radius:9px;
 padding:12px 14px;font-size:13.5px}
footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut);text-align:center}
@media(max-width:600px){body{padding:18px 12px 40px}.bloco{padding:16px 14px}h1{font-size:20px}}

.atualiz{display:flex;align-items:center;gap:8px;margin:18px 0 4px;font-size:12.5px;color:#8B85A0}
.atualiz .pt{width:8px;height:8px;border-radius:50%;background:#4CC463;box-shadow:0 0 0 0 rgba(76,196,99,.6);animation:pulsa 2.4s infinite}
@keyframes pulsa{0%{box-shadow:0 0 0 0 rgba(76,196,99,.55)}70%{box-shadow:0 0 0 7px rgba(76,196,99,0)}100%{box-shadow:0 0 0 0 rgba(76,196,99,0)}}
@media (prefers-reduced-motion:reduce){.atualiz .pt{animation:none}}

.res-ms{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:4px 0 10px}
.res-m{background:#241A3D;border:1px solid #40325F;border-radius:12px;padding:12px 13px}
.rs-v{display:block;font-size:21px;font-weight:800;letter-spacing:-.5px;line-height:1.15;color:#F1EEFB}
.rs-k{display:block;font-size:11.5px;color:#B9B0D2;margin:3px 0 6px}
.rs-d{font-size:11.5px;font-weight:700}
.rs-d.sobe{color:#4CC463} .rs-d.desce{color:#F2555A} .rs-d.zero{color:#8B85A0;font-weight:600}
.res-link{color:#A78BFA;font-size:13px;text-decoration:none;border-bottom:1px dashed rgba(167,139,250,.5)}
.res-link:hover{color:#fff;border-bottom-color:#fff}
@media(max-width:560px){.res-ms{grid-template-columns:repeat(2,1fr)}}

.dash-box{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin-top:6px}
.dash-abrir{background:linear-gradient(135deg,#8B5CF6,#A78BFA);color:#fff;border:0;border-radius:12px;
  padding:12px 20px;font:700 14px/1 inherit;cursor:pointer;box-shadow:0 8px 22px -8px rgba(139,92,246,.9);
  transition:transform .18s,box-shadow .18s}
.dash-abrir:hover{transform:translateY(-2px);box-shadow:0 12px 26px -8px rgba(139,92,246,1)}
.dash-abrir:focus-visible{outline:2px solid #F97316;outline-offset:3px}
.dash-carrega{color:#B9B0D2;font-size:13px;font-style:italic}
.dash-fr{width:100%;height:720px;border:0;border-radius:14px;background:#fff;opacity:0;transition:opacity .5s}
.dash-fr.pronto{opacity:1}
@media (prefers-reduced-motion:reduce){.dash-abrir,.dash-fr{transition:none}}

.dash-box .res-link{margin-top:2px}
@media(max-width:560px){.dash-fr{height:560px}}

/* ===== destaque do objetivo ===== */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#2E2249,#241A3D);
  border:1px solid #4a3a70;border-radius:18px;padding:22px 24px 20px;margin:0 0 18px;
  box-shadow:0 18px 40px -22px rgba(0,0,0,.9)}
.hero::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(180deg,#8B5CF6,#A78BFA)}
.hero.up::before{background:linear-gradient(180deg,#4CC463,#8fe0a0)}
.hero.down::before{background:linear-gradient(180deg,#F2555A,#ff8a8d)}
.hero-k{font-size:11.5px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:#B9B0D2}
.hero-k i{display:block;font-style:normal;font-weight:500;font-size:11.5px;letter-spacing:.2px;
  text-transform:none;color:#8B85A0;margin-top:3px}
.hero-v{font-size:46px;font-weight:800;letter-spacing:-1.6px;line-height:1.05;margin:8px 0 6px;color:#F1EEFB}
.hero-l{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.hero-x{font-size:12px;color:#B9B0D2;border:1px solid #40325F;border-radius:99px;padding:2px 9px}
.hero-meta{margin-top:14px}
.hero-bar{height:9px;background:#1C1430;border-radius:20px;overflow:hidden;border:1px solid #40325F}
.hero-bar i{display:block;height:100%;background:linear-gradient(90deg,#8B5CF6,#A78BFA);border-radius:20px;
  transition:width 1s cubic-bezier(.2,0,0,1)}
.hero-meta span{display:block;margin-top:6px;font-size:12px;color:#B9B0D2}
.hero-p{margin-top:12px;font-size:11.5px;color:#8B85A0}
@media(max-width:560px){.hero-v{font-size:36px}.hero{padding:18px 18px 16px}}
@media (prefers-reduced-motion:reduce){.hero-bar i{transition:none}}

.hero-r{position:relative;margin-top:16px;padding:13px 16px 13px 44px;border-radius:12px;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);
  font-size:13.5px;line-height:1.6;color:#E6E1F5}
.hero-asp{position:absolute;left:14px;top:6px;font-size:34px;line-height:1;color:#8B5CF6;opacity:.85;font-family:Georgia,serif}
@media(max-width:560px){.hero-r{padding:12px 13px 12px 36px;font-size:13px}.hero-asp{left:10px;font-size:28px}}

/* ===== o que falta de você ===== */
.bloco.falta{border-color:rgba(251,146,60,.35)}
.falta-row{display:flex;align-items:center;gap:14px;padding:13px 0;
  border-bottom:1px solid rgba(255,255,255,.07)}
.falta-row:last-of-type{border-bottom:0}
.falta-n{flex:0 0 auto;width:42px;height:42px;border-radius:12px;display:flex;
  align-items:center;justify-content:center;font-size:18px;font-weight:750;
  background:rgba(255,255,255,.07)}
.falta-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.falta-t b{font-size:15px;font-weight:650}
.falta-t span{font-size:13px;opacity:.62}
.falta-d{flex:0 0 auto;font-size:13px;opacity:.7;white-space:nowrap}
.f-atrasado .falta-n{background:rgba(248,113,113,.18);color:#F87171}
.f-hoje .falta-n{background:rgba(251,146,60,.18);color:#FB923C}
.f-umdia .falta-n{background:rgba(250,204,21,.18);color:#FACC15}
.f-ok .falta-n{background:rgba(52,211,153,.15);color:#34D399}
@media(max-width:560px){
  .falta-row{flex-wrap:wrap}
  .falta-d{width:100%;padding-left:56px}
}

/* ===== como está o mês: etapas encadeadas ===== */
.bloco.ciclo h2{margin-bottom:12px}
.cl-aviso{font-size:13px;line-height:1.6;background:rgba(248,113,113,.10);
  border:1px solid rgba(248,113,113,.32);border-radius:10px;padding:11px 14px;margin-bottom:16px}
.cl-aviso.ok{background:rgba(76,196,99,.09);border-color:rgba(76,196,99,.3)}
.cl-lista{display:flex;flex-direction:column}
.cl-row{display:flex;gap:14px;padding-bottom:16px}
.cl-row:last-child{padding-bottom:0}
.cl-rail{flex:0 0 auto;width:14px;display:flex;flex-direction:column;align-items:center;padding-top:5px}
.cl-rail i{width:11px;height:11px;border-radius:50%;background:var(--mut);flex:0 0 auto}
.cl-row:not(:last-child) .cl-rail::after{content:"";flex:1;width:2px;background:var(--line);margin-top:5px}
.cl-body{flex:1;min-width:0;border-left:3px solid var(--mut);border-radius:9px;
  background:var(--panel2);padding:11px 14px}
.cl-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cl-h b{font-size:14.5px;font-weight:650}
.cl-dono{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  padding:2px 9px;border-radius:99px;background:rgba(139,92,246,.22);color:#C4B5FD;white-space:nowrap}
.d-cli .cl-dono{background:rgba(245,197,24,.2);color:#F5C518}
.cl-j{font-size:12.5px;color:var(--mut);margin-top:3px}
.cl-n{font-size:12.5px;margin-top:4px;opacity:.8}
.cl-emp{font-size:12px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);color:#FF8A3D}

.e-ok .cl-rail i{background:var(--ok)}
.e-ok .cl-body{border-left-color:var(--ok)}
.e-tarde .cl-rail i{background:var(--hoje)}
.e-tarde .cl-body{border-left-color:var(--hoje)}
.e-atrasado .cl-rail i{background:var(--atrasado);box-shadow:0 0 0 4px rgba(242,85,90,.18)}
.e-atrasado .cl-body{border-left-color:var(--atrasado);background:rgba(242,85,90,.10)}
.e-atrasado .cl-n{color:#FF8E92;opacity:1;font-weight:600}
.e-agora .cl-rail i{background:var(--mk3);box-shadow:0 0 0 4px rgba(139,92,246,.2)}
.e-agora .cl-body{border-left-color:var(--mk3)}
.e-futuro{opacity:.52}
@media(max-width:560px){.cl-h{flex-direction:column;gap:4px}}

/* ===== plano do mês e fechamento ===== */
.bloco.plano{border-color:rgba(139,92,246,.32)}
.pl-l{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.pl-l:last-child{border-bottom:0}
.pl-l>span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--mut);margin-bottom:4px}
.pl-l>b{font-size:16px;font-weight:650}
.pl-l>p{font-size:14px;line-height:1.65;color:var(--txt);margin:0;white-space:pre-line}

.bloco.fecha{border-color:rgba(76,196,99,.35)}
.bloco.fecha.faltou{border-color:rgba(255,138,61,.35)}
.fc-linha{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}
.fc-rot{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.fc-delta{font-size:26px;font-weight:800;color:var(--ok);letter-spacing:-.02em}
.fc-delta.neg{color:var(--atrasado)}
.fc-graf{display:flex;align-items:flex-end;gap:26px;height:150px;padding:14px 4px 0;margin:6px 0 4px}
.fc-col{flex:0 0 84px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:center;gap:6px}
.fc-v{font-size:14px;font-weight:700;color:var(--mut)}
.fc-v.forte{color:var(--txt);font-size:16px}
.fc-bar{width:100%;border-radius:8px 8px 3px 3px;min-height:6px;
  transition:height .6s cubic-bezier(.2,.8,.2,1)}
.fc-bar.b1{background:linear-gradient(180deg,#4B3E6E,#2E2249)}
.fc-bar.b2{background:linear-gradient(180deg,#8B5CF6,#5B34C4)}
.faltou .fc-bar.b2{background:linear-gradient(180deg,#FF8A3D,#C4581F)}
.fc-col i{font-size:11px;font-style:normal;color:var(--mut);text-align:center}
.fc-meta{font-size:12.5px;color:var(--mut);padding-top:8px;border-top:1px solid rgba(255,255,255,.07)}
.fc-frase{font-size:14.5px;font-weight:600;margin:8px 0 0}
.fc-est{margin-top:12px;padding-top:11px;border-top:1px solid rgba(255,255,255,.07);
  font-size:13.5px;line-height:1.6;color:var(--mut);white-space:pre-line}
.fc-est>span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
@media(max-width:520px){.fc-graf{gap:16px;height:130px}.fc-col{flex-basis:70px}}

/* ===== calendário do cliente ===== */
.pv-topo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.pv-topo h2{margin:0}
.pv-abas{display:flex;gap:5px}
.pv-aba{background:var(--panel2);border:1px solid var(--line);color:var(--mut);font:inherit;
  font-size:12.5px;padding:5px 13px;border-radius:99px;cursor:pointer}
.pv-aba.on{background:var(--mk3);border-color:transparent;color:#fff;font-weight:600}
.cd-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin:4px 0 12px}
.cd-nav strong{font-size:14.5px;text-transform:capitalize;min-width:170px;text-align:center}
.cd-nav button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;line-height:1}
.cd-nav button:hover{background:var(--line)}
.cd-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.cd-dow span{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);
  text-align:center;padding:2px 0}
.cd-grade{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cd-vazio{min-height:70px}
.cd-d{min-height:70px;background:var(--panel2);border:1px solid transparent;border-radius:8px;
  padding:5px 5px 6px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cd-d.fds{opacity:.55}
.cd-d.hoje{border-color:var(--mk3);box-shadow:0 0 0 2px rgba(139,92,246,.22)}
.cd-n{font-size:11px;color:var(--mut);font-weight:600}
.cd-d.hoje .cd-n{color:var(--txt)}
.cd-d.j-mk3{background:linear-gradient(180deg,rgba(139,92,246,.16),rgba(139,92,246,.07))}
.cd-d.j-cli{background:linear-gradient(180deg,rgba(245,197,24,.15),rgba(245,197,24,.06))}
.cd-d.j-alerta{background:linear-gradient(180deg,rgba(242,85,90,.22),rgba(242,85,90,.09));
  border-color:rgba(242,85,90,.4)}
.cd-itens{display:flex;flex-direction:column;gap:2px;min-width:0}
.cd-i{font-size:9.5px;line-height:1.3;padding:2px 4px;border-radius:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.cd-mk3{background:rgba(139,92,246,.34);color:#E9E2FF}
.cd-cli{background:rgba(245,197,24,.28);color:#FFEDA8;font-weight:600}
.cd-atr{background:rgba(242,85,90,.4);color:#FFD9DA;font-weight:700}
.cd-ok{background:rgba(76,196,99,.2);color:#BFEBC7;text-decoration:line-through;opacity:.75}
.cd-marco{background:rgba(255,255,255,.12);color:var(--txt);font-style:italic}
.cd-leg{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:11.5px;color:var(--mut)}
.cd-leg span{display:flex;align-items:center;gap:5px}
.cd-leg i{width:9px;height:9px;border-radius:3px;display:block}
.l-mk3{background:rgba(139,92,246,.6)}.l-cli{background:rgba(245,197,24,.6)}
.l-atr{background:rgba(242,85,90,.7)}.l-ok{background:rgba(76,196,99,.5)}
@media(max-width:620px){
  .cd-d{min-height:56px;padding:3px}
  .cd-i{font-size:0;padding:0;height:5px;border-radius:99px;margin-bottom:1px}
  .cd-n{font-size:10px}
}

/* ===== dia aberto: janela sobre a tela ===== */
button.cd-d{font:inherit;text-align:left;color:inherit;cursor:default;width:100%}
button.cd-d.tem{cursor:pointer}
button.cd-d.tem:hover{filter:brightness(1.3)}
button.cd-d.sel{border-color:var(--txt);box-shadow:0 0 0 2px rgba(241,238,251,.35)}
.cd-dica{margin-top:12px;font-size:12.5px;color:var(--mut);opacity:.75}
body.travado{overflow:hidden}
.dd-fundo{position:fixed;inset:0;z-index:60;background:rgba(10,6,20,.72);
  backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;
  padding:20px;animation:ddIn .16s ease}
@keyframes ddIn{from{opacity:0}to{opacity:1}}
.dd-box{width:100%;max-width:520px;max-height:86vh;overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:20px 22px;box-shadow:0 24px 60px rgba(0,0,0,.55);
  animation:ddUp .2s cubic-bezier(.2,.8,.2,1)}
@keyframes ddUp{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.dd-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.dd-h b{font-size:17px;text-transform:capitalize;letter-spacing:-.01em}
.dd-h button{background:transparent;border:0;color:var(--mut);font-size:24px;line-height:1;
  cursor:pointer;padding:0 4px}
.dd-h button:hover{color:var(--txt)}
.dd-faixa{font-size:13px;line-height:1.55;border-radius:9px;padding:11px 13px;margin-bottom:13px;
  background:rgba(139,92,246,.14);border:1px solid rgba(139,92,246,.3)}
.dd-faixa.cli{background:rgba(245,197,24,.12);border-color:rgba(245,197,24,.32)}

const d    = s => { const [a,m,x]=s.split("-").map(Number); return new Date(a,m-1,x); };
const iso  = t => t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");

const dias = s => Math.round((d(s)-HOJE)/86400000);

/* soma N dias ÚTEIS (pula sábado e domingo) */
const uteis = (s,n) => {
  if(!s) return null;
  let x = d(s), c = 0;
  while(c < n){ x.setDate(x.getDate()+1); const w = x.getDay(); if(w!==0 && w!==6) c++; }
  return iso(x);
};
const PRAZO = 2;

/* quantos dias ÚTEIS separam o limite da data real (0 = no prazo) */
const uteisEntre = (limite, real) => {
  if(!limite || !real || real <= limite) return 0;
  let n=0, x=d(limite);
  while(iso(x) < real){ x.setDate(x.getDate()+1); const w=x.getDay(); if(w!==0&&w!==6) n++; }
  return n;
};
const maiorData = (a,b) => !a ? b : !b ? a : (a>b ? a : b);

/* ---------------- REGRAS ---------------- */
/* Conclusão de uma tarefa. Em `concluidas` aceita:
   - "id"            -> concluído (sem data, assume no prazo)
   - {id, data}      -> concluído naquela data (o painel calcula prazo/atraso) */
const conclusaoDe = (c, id) => {

    if(e && e.id === id) return {feita:true, data:e.data||null};

};

function mesesDepois(isoData, n){
  const p=String(isoData).split("-").map(Number);

  d.setDate(Math.min(p[2], ultimo));

}

  const rpq = ocorrenciaAtual(c, D0, 6, "rec_pesq", "pesq6m");

    add("acaoComercial","Contrato","Ação comercial — contrato encerra em 1 semana",
        "Contato para renovação/negociação com o cliente",addD(c.vencimentoContrato,-7),"Gestão");
  add("fimContrato","Contrato","Encerramento do contrato",
      c.contrato?("Contrato "+c.contrato):"",c.vencimentoContrato,"Gestão");

    add("entregaMateriais","Contrato","Entregar todos os materiais produzidos",
        "Artes, textos e editáveis · tolerância até "+fmt(uteis(c.vencimentoContrato,10)),
        c.vencimentoContrato,"Analista");
  }

  /* mensalidade: todo dia 20 enquanto o contrato estiver vigente */
  if(c.mensalidade && c.vencimentoContrato){
    const dia = c.mensalidade.diaVencimento;
    let m = new Date(d(c.inicioContrato||D0).getFullYear(), d(c.inicioContrato||D0).getMonth(), dia);

/* ---------------- ATRASOS ---------------- */
/* Compara o limite da regra com a data real. Só registra o que já

  const out=[];
  const just = etapa => (c.justificados||[]).find(j=>j.etapa===etapa);
  const reg=(etapa,quem,limite,real)=>{
    if(!limite || !real) return;
    const n = uteisEntre(limite, real);
    if(n>0){
      const j = just(etapa);
      out.push({cliente:c.nome, etapa, quem, limite, real, dias:n,
                justificado: !!j, motivo: j ? j.motivo : null});
    }

  const R = c.reuniaoPlanejamentoEntrada;
  if(!R) return out;

  const limEnvPlan  = uteis(R, PRAZO);
  reg("Entrega do planejamento","MK3", limEnvPlan, c.envioPlanejamento);

  const baseEnvPlan = c.envioPlanejamento || limEnvPlan;
  const limAprPlan  = uteis(baseEnvPlan, PRAZO);

  const baseAprPlan  = c.aprovacaoPlanejamento || limAprPlan;

  /* limite PELA REGRA: 2 dias úteis após a aprovação do planejamento */
  const limArtesRegra = uteis(baseAprPlan, PRAZO);

     começam a contar depois da gravação */
  const gatilhoArtes = c.artesDependemDaGravacao && c.gravacao
                     ? maiorData(baseAprPlan, c.gravacao) : baseAprPlan;
  const limArtes     = uteis(gatilhoArtes, PRAZO);

  /* a dependência NÃO apaga o prazo: se ela estoura a régua, isso é
     um atraso previsto e tem de aparecer antes de acontecer */
  const nPrev = uteisEntre(limArtesRegra, limArtes);
  if(nPrev>0 && !c.envioMidia){
    const j = just("Entrega das artes");
    out.push({cliente:c.nome, etapa:"Entrega das artes", quem:"MK3", previsto:true,
              limite:limArtesRegra, real:limArtes, dias:nPrev,
              justificado: !!j,
              motivo: j ? j.motivo : null,
              causa:"depende das fotos da gravação de "+fmt(c.gravacao)});
  }

  reg("Entrega das artes","MK3", limArtesRegra, c.envioMidia);

  const baseEnvMid = c.envioMidia || limArtes;
  const limAprMid  = uteis(baseEnvMid, PRAZO);
  reg("Aprovação das artes","Cliente", limAprMid, c.aprovacaoMidia);

  return out;
}

function status(t){
  if(t.feita){
    if(t.dataConclusao && t.data){
      const n=uteisEntre(t.data, t.dataConclusao);
      if(n>0) return {k:"ok", atraso:n, quando:t.dataConclusao,
                      txt:"Concluído · atrasou "+n+(n===1?" dia útil":" dias úteis")};
      return {k:"ok", atraso:0, quando:t.dataConclusao, txt:"Concluído na data"};
    }
    return {k:"ok", txt:"Concluído"};
  }
  if(!t.data) return {k:"sem",txt:"Sem data"};
  const n=dias(t.data);
  if(n<0)   return {k:"atrasado",txt:"Atrasado "+Math.abs(n)+"d"};
  if(n===0) return {k:"hoje",txt:"Vence hoje"};
  if(n===1) return {k:"umdia",txt:"Falta 1 dia"};
  if(n<=7)  return {k:"semana",txt:"Faltam "+n+" dias"};
  return {k:"futuro",txt:"Faltam "+n+" dias"};
}

</script>
<script>/* Portal do cliente — somente leitura. Usa as mesmas regras do painel. */
const C = CLIENTES[0];
const ORIGINAL = JSON.parse(JSON.stringify(C));
const CAMPOS_DATA = ["envioPlanejamento","aprovacaoPlanejamento","envioMidia","aprovacaoMidia","gravacao","alteracaoPedida"];
const $ = id => document.getElementById(id);
const escAttr = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
let TAREFAS = regras(C).map(t=>({...t, st:status(t)}));
let RESULTADOS=null, OBJETIVO="", META=null, RECADO="", PENDENCIAS=null, PLANO=null;
let TEM_ESPELHO=false, FONTE=null, ULTIMO=null, DASH_ABERTO=false;

/* aplica o estado publicado pela MK3 (o que foi marcado no painel) */
function aplicarEstado(E){
  if(!E) return;
  C.concluidas=(ORIGINAL.concluidas||[]).slice();
  CAMPOS_DATA.forEach(k=>C[k]=ORIGINAL[k]);
  const dd=(E.datas&&E.datas[CLIENTE_ID])||{};
  for(const k in dd){ if(dd[k]) C[k]=dd[k]; }
  for(const e of ((E.concluidas&&E.concluidas[CLIENTE_ID])||[])){
    C.concluidas=C.concluidas.filter(x=>((x&&x.id)?x.id:x)!==e.id);
    if(!e.remove) C.concluidas.push(e.data?{id:e.id,data:e.data}:e.id);
  }
  TAREFAS = regras(C).map(t=>({...t, st:status(t)}));
}
function linkValido(E){
  const p=(E&&E.portais&&E.portais[CLIENTE_ID])||null;
  if(!p || !p.ativo) return true;             /* sem configuração = vale */
  return p.ativo===MEU_TOKEN;
}
function expirado(){
  document.getElementById("view").innerHTML=
    '<section class="bloco"><h2>Link expirado</h2>'+
    '<p>Este endereço foi substituído por um novo, por segurança. Peça o link atualizado à equipe da MK3.</p></section>';
}

$("hoje").textContent = HOJE.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});
$("titulo").textContent = C.nome;

/* ---- 1) o que está esperando o cliente ---- */
function pendentes(){
  /* o painel manda a lista pronta; sem espelho, calcula pelas mesmas regras */
  if(PENDENCIAS) return PENDENCIAS.slice();
  return contadores(C).map(x=>({tipo:x.tipo, enviado:x.enviado, vencimento:x.vencimento, dias:dias(x.vencimento)}));
}
function faltaVoce(){
  const p=pendentes();
  if(!p.length) return '';
  return '<section class="bloco falta"><h2>O que falta de voc\u00ea</h2>'+
    p.sort((a,b)=>String(a.vencimento).localeCompare(String(b.vencimento))).map(x=>{
      const n=(x.dias==null?dias(x.vencimento):x.dias);
      const urg = n<0?"atrasado":n===0?"hoje":n===1?"umdia":"ok";
      const quanto = n<0 ? "o prazo venceu, seguimos com a aprova\u00e7\u00e3o autom\u00e1tica"
                   : n===0 ? "vence hoje"
                   : n===1 ? "falta 1 dia \u00fatil"
                   : "faltam "+n+" dias \u00fateis";
      return '<div class="falta-row f-'+urg+'">'+
        '<div class="falta-n">'+(n<0?"!":Math.max(n,0))+'</div>'+
        '<div class="falta-t"><b>Aprovar '+esc(x.tipo)+'</b>'+
          '<span>Enviamos em '+fmt(x.enviado)+' \u00b7 '+quanto+'</span></div>'+
        '<div class="falta-d">at\u00e9 '+fmt(x.vencimento)+'</div></div>';
    }).join("")+
    '<p class="nota">Sem retorno at\u00e9 o prazo, seguimos com a aprova\u00e7\u00e3o autom\u00e1tica para n\u00e3o travar a produ\u00e7\u00e3o.</p></section>';
}
function esperando(){
  const ct = contadores(C);
  const tiposAprov = ct.map(x=>("aprova\u00e7\u00e3o de "+x.tipo).toLowerCase());
  const meus = TAREFAS.filter(t=>t.resp==="Cliente" && t.st.k!=="ok" && t.data &&
      tiposAprov.indexOf(String(t.tarefa).toLowerCase())<0)      /* aprova\u00e7\u00e3o j\u00e1 aparece no bloco de cima */
    .sort((a,b)=>String(a.data).localeCompare(String(b.data)));
  if(!meus.length && !pendentes().length)
    return '<section class="bloco ok"><h2>Nada esperando voc\u00ea</h2>'+
      '<p>Est\u00e1 tudo com a gente no momento. Assim que houver algo para aprovar, aparece aqui.</p></section>';
  if(!meus.length) return '';
  const tit = pendentes().length ? "Tamb\u00e9m com voc\u00ea" : "O que falta de voc\u00ea";
  return '<section class="bloco"><h2>'+tit+'</h2>'+
    meus.map(t=>{
      const n = dias(t.data);
      const urg = n<0?"atrasado":n===0?"hoje":n===1?"umdia":"ok";
      const txt = n<0?("prazo venceu h\u00e1 "+Math.abs(n)+" dia"+(Math.abs(n)>1?"s":"")) : n===0?"vence hoje" : "faltam "+n+" dias";
      return '<div class="item i-'+urg+'"><div class="i-t">'+esc(t.tarefa)+'</div>'+
        '<div class="i-m">Prazo '+fmt(t.data)+' \u00b7 '+txt+'</div></div>';
    }).join("")+'</section>';
}

/* ---- o plano do mes e o fechamento: promessa contra resultado ---- */
const ROTOBJ = {seguidores:"Seguidores", alcance:"Alcance", perfil:"Visitas ao perfil", views:"Visualizacoes"};
function mesNome(ym){
  const d0=new Date(+ym.slice(0,4), +ym.slice(5,7)-1, 1);
  return d0.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
}
function ymDe(desloc){
  const d0=new Date(HOJE.getFullYear(), HOJE.getMonth()+(desloc||0), 1);
  return d0.getFullYear()+"-"+String(d0.getMonth()+1).padStart(2,"0");
}
function planoMes(ym){ return (PLANO&&PLANO[ym])||null; }
function numPT(n){ return (n==null||isNaN(n))?"-":Number(n).toLocaleString("pt-BR"); }
function soNumero(txt){ const m=String(txt||"").replace(/\./g,"").match(/-?[0-9]+/); return m?Number(m[0]):null; }
/* fecha o mes: de onde saiu, onde chegou, e o que tinha sido prometido */
function fechamento(ym){
  const p=planoMes(ym); if(!p) return null;
  const R=(RESULTADOS&&RESULTADOS[ym])||null; if(!R) return null;
  const d=R.destaque||null;
  let fim=null, ganho=null;
  if(d && d.v!=null){ fim=d.v; ganho=(d.novos!=null?d.novos:null); }
  else if(R.metricas&&R.metricas.length){ fim=R.metricas[0].v; }
  if(fim==null) return null;
  let base=(p.base!=null?p.base:null);
  if(base==null && ganho!=null) base=fim-ganho;
  if(base==null) return null;
  if(ganho==null) ganho=fim-base;
  return {base:base, fim:fim, ganho:ganho, esperado:soNumero(p.esperado),
          rot:(d&&d.k)||((R.metricas&&R.metricas[0]&&R.metricas[0].k)||"Resultado")};
}
function barrasHTML(f){
  const topo=Math.max(f.base, f.fim, 1);
  const alt=v=>Math.max(6, Math.round(v/topo*100));
  return '<div class="fc-graf">'+
    '<div class="fc-col"><span class="fc-v">'+numPT(f.base)+'</span>'+
      '<div class="fc-bar b1" style="height:'+alt(f.base)+'%"></div><i>inicio do mes</i></div>'+
    '<div class="fc-col"><span class="fc-v forte">'+numPT(f.fim)+'</span>'+
      '<div class="fc-bar b2" style="height:'+alt(f.fim)+'%"></div><i>fim do mes</i></div>'+
  '</div>';
}
function planoHTML(){
  const ymA=ymDe(0), ymP=ymDe(-1);
  let h="";
  const f=fechamento(ymP), pp=planoMes(ymP);
  if(f && pp){
    const bateu = f.esperado!=null ? (f.ganho>=f.esperado) : (f.ganho>0);
    const dif = f.esperado!=null ? (f.ganho-f.esperado) : null;
    const frase = f.esperado==null
      ? (f.ganho>=0?"Fechamos com "+numPT(f.ganho)+" a mais.":"Fechamos com "+numPT(Math.abs(f.ganho))+" a menos.")
      : (dif>0 ? "Passamos do combinado em "+numPT(dif)+"."
        : dif===0 ? "Entregamos exatamente o combinado."
        : "Ficamos "+numPT(Math.abs(dif))+" abaixo do combinado.");
    h+='<section class="bloco fecha '+(bateu?"bateu":"faltou")+'">'+
      '<h2>Fechamento de '+esc(mesNome(ymP))+'</h2>'+
      '<div class="fc-linha"><span class="fc-rot">'+esc(f.rot)+'</span>'+
        '<span class="fc-delta'+(f.ganho>=0?"":" neg")+'">'+(f.ganho>=0?"+":"")+numPT(f.ganho)+'</span></div>'+
      barrasHTML(f)+
      (f.esperado!=null?'<div class="fc-meta">Combinado no plano: <b>'+numPT(f.esperado)+'</b></div>':'')+
      '<p class="fc-frase">'+esc(frase)+'</p>'+
      (pp.estrategia?'<div class="fc-est"><span>O que fizemos</span>'+esc(pp.estrategia)+'</div>':'')+
      '</section>';
  }
  const p=planoMes(ymA);
  if(p && (p.estrategia||p.esperado)){
    h+='<section class="bloco plano"><h2>O plano de '+esc(mesNome(ymA))+'</h2>'+
      (OBJETIVO?'<div class="pl-l"><span>Objetivo do mes</span><b>'+esc(ROTOBJ[OBJETIVO]||OBJETIVO)+'</b></div>':'')+
      (p.estrategia?'<div class="pl-l"><span>Estrategia</span><p>'+esc(p.estrategia)+'</p></div>':'')+
      (p.esperado?'<div class="pl-l"><span>Resultado esperado</span><b>'+esc(p.esperado)+'</b></div>':'')+
      '</section>';
  }
  return h;
}

/* ---- 2) o mes em etapas: quem tem a bola, at\u00e9 quando, e o que o atraso empurra ----
   Cada etapa comeca quando a anterior termina de verdade. Por isso um atraso do
   cliente aparece empurrando tudo que vem depois, com o numero de dias uteis. */
function ymAtual(){ const d0=HOJE; return d0.getFullYear()+"-"+String(d0.getMonth()+1).padStart(2,"0"); }
const ETAPAS = [
  {p:"envPlanej", c1:"c1_plan",   rot:"Planejamento do m\u00eas",        dono:"MK3",   verbo:"entregamos"},
  {p:"aprPlanej", c1:"c1_aprPlan",rot:"Aprova\u00e7\u00e3o do planejamento", dono:"VOCE",  verbo:"voc\u00ea aprova"},
  {p:"envMidia",  c1:"c1_artes",  rot:"Artes e v\u00eddeos",             dono:"MK3",   verbo:"entregamos"},
  {p:"aprMidia",  c1:"c1_aprMid", rot:"Aprova\u00e7\u00e3o das artes",       dono:"VOCE",  verbo:"voc\u00ea aprova"},
  {p:"agendado",  c1:"c1_podepostar", c1b:"c1_entrega", rot:"Conte\u00fado no ar", dono:"MK3", verbo:"publicamos"}
];
function acharEtapa(e, ym){
  return TAREFAS.find(t=>t.id===e.p+"_"+ym)
      || TAREFAS.find(t=>t.id===e.c1)
      || (e.c1b?TAREFAS.find(t=>t.id===e.c1b):null) || null;
}
function cicloEtapas(){
  const ym=ymAtual(), hoje=iso(HOJE), out=[];
  let fimAnterior=null, arrasto=0;
  ETAPAS.forEach(e=>{
    const t=acharEtapa(e,ym); if(!t || !t.data) return;
    const feita = t.st.k==="ok";
    const real  = feita ? (t.dataConclusao||t.data) : null;
    const prazo = t.data;
    const inicio= fimAnterior || prazo;
    let atraso=0;
    if(real) atraso=uteisEntre(prazo, real);
    else if(hoje>prazo) atraso=uteisEntre(prazo, hoje);
    if(atraso<0) atraso=0;
    const estado = feita ? (atraso>0?"tarde":"ok")
                 : (hoje>prazo ? "atrasado" : (inicio<=hoje ? "agora" : "futuro"));
    out.push({rot:e.rot, dono:e.dono, verbo:e.verbo, inicio:inicio, prazo:prazo,
              real:real, atraso:atraso, estado:estado, arrasto:arrasto});
    if(e.dono==="VOCE" && atraso>0) arrasto+=atraso;     /* so o atraso do cliente empurra */
    fimAnterior = real || (hoje>prazo?hoje:prazo);
  });
  return out;
}
function cicloHTML(){
  const et=cicloEtapas();
  if(et.length<2) return '';
  const mes=HOJE.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  const totalArr=et.reduce((a,x)=>Math.max(a,x.arrasto),0);
  const linhas=et.map(x=>{
    const janela = x.inicio===x.prazo ? fmt(x.prazo) : (fmt(x.inicio)+" a "+fmt(x.prazo));
    let nota="";
    if(x.estado==="ok")        nota="feito no prazo"+(x.real?", em "+fmt(x.real):"");
    else if(x.estado==="tarde")nota="saiu "+x.atraso+" dia"+(x.atraso>1?"s \u00fateis":" \u00fatil")+" depois do combinado"+(x.real?", em "+fmt(x.real):"");
    else if(x.estado==="atrasado") nota="parado h\u00e1 "+x.atraso+" dia"+(x.atraso>1?"s \u00fateis":" \u00fatil")+", prazo era "+fmt(x.prazo);
    else if(x.estado==="agora")nota="em andamento, prazo "+fmt(x.prazo);
    else                       nota="ainda n\u00e3o come\u00e7ou";
    const empurrada = x.arrasto>0 && x.dono==="MK3" && x.estado!=="ok"
      ? '<div class="cl-emp">empurrada '+x.arrasto+' dia'+(x.arrasto>1?'s \u00fateis':' \u00fatil')+' pela aprova\u00e7\u00e3o anterior</div>' : '';
    return '<div class="cl-row e-'+x.estado+' d-'+(x.dono==="VOCE"?"cli":"mk3")+'">'+
      '<span class="cl-rail"><i></i></span>'+
      '<div class="cl-body">'+
        '<div class="cl-h"><b>'+esc(x.rot)+'</b>'+
          '<span class="cl-dono">'+(x.dono==="VOCE"?"com voc\u00ea":"com a MK3")+'</span></div>'+
        '<div class="cl-j">'+esc(janela)+'</div>'+
        '<div class="cl-n">'+esc(nota)+'</div>'+ empurrada +
      '</div></div>';
  }).join("");
  const resumo = totalArr>0
    ? '<div class="cl-aviso">O ciclo deste m\u00eas est\u00e1 <b>'+totalArr+' dia'+(totalArr>1?'s \u00fateis':' \u00fatil')+
      '</b> atr\u00e1s do previsto, e a origem foi a aprova\u00e7\u00e3o. Cada etapa s\u00f3 come\u00e7a quando a anterior termina, '+
      'ent\u00e3o o que atrasa em uma ponta desloca tudo que vem depois.</div>'
    : '<div class="cl-aviso ok">Ciclo em dia. Cada etapa comeca quando a anterior termina, ent\u00e3o manter as aprova\u00e7\u00f5es no prazo mant\u00e9m a publica\u00e7\u00e3o na data.</div>';
  return '<section class="bloco ciclo"><h2>Como est\u00e1 '+esc(mes)+'</h2>'+
    resumo+'<div class="cl-lista">'+linhas+'</div></section>';
}

/* ---- 2) próximos passos (o que vem) ---- */
let PMES = 0, PDIA = null;                       /* 0 = mes corrente, -1 = anterior, 1 = seguinte */
let PVISAO = "cal";                 /* cal ou lista */
function tarefasDoPortal(){
  return TAREFAS.filter(t=>t.data && t.fase!=="Contrato" && !/^pag_|^fotos_/.test(t.id));
}
/* janelas de cada etapa: serve para pintar o intervalo no calendario */
function faixas(){
  return cicloEtapas().map(x=>({
    ini:x.inicio, fim:x.prazo, dono:x.dono, estado:x.estado, rot:x.rot
  }));
}
function proximos(){
  const abas='<div class="pv-abas">'+
    '<button class="pv-aba'+(PVISAO==="cal"?" on":"")+'" data-pvisao="cal">Calendário</button>'+
    '<button class="pv-aba'+(PVISAO==="lista"?" on":"")+'" data-pvisao="lista">Lista</button></div>';
  return PVISAO==="cal" ? calendarioHTML(abas) : listaHTML(abas);
}
function listaHTML(abas){
  const hoje=iso(HOJE);
  const ts=tarefasDoPortal().filter(t=>t.data>=hoje && t.st.k!=="ok")
    .sort((a,b)=>String(a.data).localeCompare(String(b.data))).slice(0,10);
  if(!ts.length) return '<section class="bloco"><div class="pv-topo"><h2>Próximos passos</h2>'+abas+'</div>'+
    '<p>Nada programado daqui para frente.</p></section>';
  return '<section class="bloco"><div class="pv-topo"><h2>Próximos passos</h2>'+abas+'</div><div class="linha-lista">'+
    ts.map(t=>'<div class="ln"><span class="ln-d">'+fmt(t.data)+'</span>'+
      '<span class="ln-t">'+esc(t.tarefa)+'</span>'+
      '<span class="ln-q '+(t.resp==="Cliente"?"cli":"mk3")+'">'+(t.resp==="Cliente"?"com você":"com a MK3")+'</span></div>').join("")+
    '</div></section>';
}
/* ---- o dia aberto: o que acontece nele e de quem e a vez ---- */
function detalheDia(){
  if(!PDIA) return '';
  const hoje=iso(HOJE);
  const ts=tarefasDoPortal().filter(t=>t.data===PDIA)
    .sort((a,b)=>String(a.resp).localeCompare(String(b.resp)));
  const mk=(C.marcos||[]).filter(m=>m.data===PDIA);
  const f=faixas().find(x=>x.ini<=PDIA && PDIA<=x.fim);
  const d0=d(PDIA);
  const titulo=d0.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"});
  let corpo="";
  if(f){
    const dono = f.dono==="VOCE" ? "com você" : "com a MK3";
    const alerta = f.estado==="atrasado";
    corpo+='<div class="dd-faixa '+(f.dono==="VOCE"?"cli":"mk3")+(alerta?" alerta":"")+'">'+
      '<b>'+esc(f.rot)+'</b> está '+dono+' neste dia'+
      (alerta?' e o prazo já passou. Enquanto isso não sai, as etapas seguintes ficam paradas.'
             :', dentro do prazo de '+fmt(f.ini)+' a '+fmt(f.fim)+'.')+'</div>';
  }
  if(!ts.length && !mk.length){
    corpo+='<p class="dd-vazio">Nada marcado para este dia.</p>';
  } else {
    corpo+='<div class="dd-lista">'+
      mk.map(m=>'<div class="dd-i marco"><span class="dd-q">marco</span>'+
        '<span class="dd-t">'+esc(m.titulo)+(m.detalhe?'<i>'+esc(m.detalhe)+'</i>':'')+'</span></div>').join("")+
      ts.map(t=>{
        const feita=t.st.k==="ok";
        const atrasada=!feita && t.data<hoje;
        const cls=feita?"ok":(atrasada?"atr":(t.resp==="Cliente"?"cli":"mk3"));
        const sit=feita?("concluído"+(t.st.quando?" em "+fmt(t.st.quando):""))
                 :atrasada?("em atraso desde "+fmt(t.data))
                 :(t.data===hoje?"para hoje":"programado");
        return '<div class="dd-i '+cls+'">'+
          '<span class="dd-q">'+(t.resp==="Cliente"?"com você":"com a MK3")+'</span>'+
          '<span class="dd-t">'+esc(t.tarefa)+(t.detalhe?'<i>'+esc(t.detalhe)+'</i>':'')+'</span>'+
          '<span class="dd-s">'+esc(sit)+'</span></div>';
      }).join("")+'</div>';
  }
  return '<div class="dd-fundo" data-pdia="">'+
    '<div class="dd-box" role="dialog" aria-modal="true" aria-label="'+escAttr(titulo)+'">'+
      '<div class="dd-h"><b>'+esc(titulo)+'</b>'+
      '<button data-pdia="" aria-label="Fechar">&times;</button></div>'+corpo+
    '</div></div>';
}
function calendarioHTML(abas){
  const hoje=iso(HOJE);
  const ref=new Date(HOJE.getFullYear(), HOJE.getMonth()+PMES, 1);
  const ano=ref.getFullYear(), mes=ref.getMonth();
  const desloc=ref.getDay(), nDias=new Date(ano,mes+1,0).getDate();
  const ts=tarefasDoPortal();
  const fx=faixas();
  const mk=(C.marcos||[]);

  let cels="";
  for(let i=0;i<desloc;i++) cels+='<div class="cd-vazio"></div>';
  for(let d0=1;d0<=nDias;d0++){
    const dia=iso(new Date(ano,mes,d0));
    const doDia=ts.filter(t=>t.data===dia);
    const marcos=mk.filter(m=>m.data===dia);
    /* a janela que cobre este dia diz de quem e a bola */
    const f=fx.find(x=>x.ini<=dia && dia<=x.fim);
    const cobre = f ? (" j-"+(f.dono==="VOCE"?"cli":"mk3")+(f.estado==="atrasado"?" j-alerta":"")) : "";
    const fds=[0,6].indexOf(new Date(ano,mes,d0).getDay())>=0;
    const itens=doDia.map(t=>{
      const feita=t.st.k==="ok";
      const atrasada=!feita && t.data<hoje;
      const cls=feita?"ok":(atrasada?"atr":(t.resp==="Cliente"?"cli":"mk3"));
      return '<span class="cd-i cd-'+cls+'" title="'+esc(t.tarefa)+(t.resp==="Cliente"?" (com você)":" (com a MK3)")+'">'+
        esc(t.tarefa)+'</span>';
    }).join("")+marcos.map(m=>'<span class="cd-i cd-marco" title="'+esc(m.titulo)+'">'+esc(m.titulo)+'</span>').join("");
    const temAlgo = doDia.length || marcos.length;
    cels+='<button type="button" class="cd-d'+(dia===hoje?" hoje":"")+(fds?" fds":"")+cobre+
      (temAlgo?" tem":"")+(dia===PDIA?" sel":"")+'" data-pdia="'+dia+'"'+
      ' aria-label="'+esc(fmt(dia))+(temAlgo?", "+(doDia.length+marcos.length)+" item(ns)":", sem nada")+'">'+
      '<span class="cd-n">'+d0+'</span>'+(itens?'<div class="cd-itens">'+itens+'</div>':'')+'</button>';
  }
  const nomeMes=ref.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  const legenda='<div class="cd-leg">'+
    '<span><i class="l-mk3"></i>com a MK3</span>'+
    '<span><i class="l-cli"></i>com você</span>'+
    '<span><i class="l-atr"></i>fora do prazo</span>'+
    '<span><i class="l-ok"></i>concluído</span></div>';
  return '<section class="bloco cal"><div class="pv-topo"><h2>Calendário</h2>'+abas+'</div>'+
    '<div class="cd-nav"><button data-pmes="'+(PMES-1)+'" aria-label="Mês anterior">&lsaquo;</button>'+
      '<strong>'+esc(nomeMes)+'</strong>'+
      '<button data-pmes="'+(PMES+1)+'" aria-label="Próximo mês">&rsaquo;</button></div>'+
    '<div class="cd-dow"><span>dom</span><span>seg</span><span>ter</span><span>qua</span><span>qui</span><span>sex</span><span>sáb</span></div>'+
    '<div class="cd-grade">'+cels+'</div>'+
    '<div class="cd-dica">Clique em qualquer dia para ver o que acontece nele.</div>'+ legenda +
    '<p class="nota">O fundo de cada dia mostra de quem é a vez: roxo com a MK3, amarelo com você. '+
    'Quando a sua parte passa do prazo, o bloco fica vermelho e tudo que vem depois anda junto.</p>'+
    '</section>';
}

/* ---- 3) linha do tempo com atrasos e efeito cascata ---- */
function historico(){
  if(!MOSTRA_HISTORICO) return '';
  const hojeIso=iso(HOJE);
  /* só o que é responsabilidade do cliente: aprovações e envios de material dele */
  const consumados = atrasos(C).filter(a=>a.quem==="Cliente" && !a.previsto);
  const emAberto = TAREFAS.filter(t=>t.resp==="Cliente" && t.st.k!=="ok" && t.data && t.data<hojeIso)
    .map(t=>({etapa:t.tarefa, limite:t.data, dias:uteisEntre(t.data,hojeIso), aberto:true}))
    .filter(a=>a.dias>0);
  const todos = consumados.concat(emAberto).sort((a,b)=>String(a.limite).localeCompare(String(b.limite)));
  const marcos = [...(C.marcos||[])].sort((a,b)=>a.data.localeCompare(b.data));

  let h='<section class="bloco"><h2>Linha do tempo</h2>';
  if(marcos.length){
    h+='<div class="tl">'+marcos.map(m=>'<div class="tl-i"><span class="tl-d">'+fmt(m.data)+'</span>'+
      '<span class="tl-t">'+esc(m.titulo)+(m.detalhe?' <i>'+esc(m.detalhe)+'</i>':'')+'</span></div>').join("")+'</div>';
  }
  if(todos.length){
    h+='<h3 class="sub">Aprovações fora do prazo</h3>'+
      '<p class="nota">Registro objetivo, para explicar o remanejamento das entregas. Prazos em dias úteis.</p>'+
      todos.map(a=>{
        const dias1=a.dias, plural=dias1>1;
        if(a.aberto){
          /* o que está parado esperando esta aprovação */
          const parado=TAREFAS.filter(t=>t.resp!=="Cliente" && t.st.k!=="ok" && t.data && t.data>=a.limite)
            .sort((x,y)=>String(x.data).localeCompare(String(y.data))).slice(0,2);
          return '<div class="atr aberto"><div class="a-t">'+esc(a.etapa)+' <span class="tagx">em aberto</span></div>'+
            '<div class="a-m">Prazo era '+fmt(a.limite)+' · <b>'+dias1+(plural?' dias úteis':' dia útil')+' sem retorno</b></div>'+
            (parado.length?'<div class="a-e">Enquanto isso, segue parado: '+parado.map(t=>esc(t.tarefa)).join(" · ")+'</div>':'')+
          '</div>';
        }
        const dep=TAREFAS.filter(t=>t.data && a.real && t.data>=a.real && /arte|Pode Postar|roteiro|agendad/i.test(t.tarefa))
          .sort((x,y)=>String(x.data).localeCompare(String(y.data))).slice(0,2);
        return '<div class="atr"><div class="a-t">'+esc(a.etapa)+'</div>'+
          '<div class="a-m">Prazo '+fmt(a.limite)+' · retorno em '+fmt(a.real)+' · <b>'+dias1+(plural?' dias úteis':' dia útil')+' além do prazo</b></div>'+
          (dep.length?'<div class="a-e">Efeito: '+dep.map(t=>esc(t.tarefa)+" ficou para "+fmt(t.data)).join(" · ")+'</div>':'')+
        '</div>';
      }).join("");
  } else {
    h+='<div class="ok-box">Nenhuma aprovação fora do prazo até aqui. Obrigado pela agilidade.</div>';
  }
  h+='</section>';
  return h;
}


/* ---- destaque: o objetivo do cliente, em primeiro lugar ---- */
const ROT_OBJ = { seguidores:"Seguidores", alcance:"Alcance", perfil:"Visitas ao perfil", views:"Visualizações" };
function destaqueAtual(){
  if(!OBJETIVO || !RESULTADOS) return null;
  const ks=Object.keys(RESULTADOS).sort(); if(!ks.length) return null;
  const r=RESULTADOS[ks[ks.length-1]]; if(!r) return null;
  if(r.destaque && r.destaque.obj===OBJETIVO) return {...r.destaque, periodo:r.periodo, compara:r.compara};
  const rot=ROT_OBJ[OBJETIVO];
  const m=(r.metricas||[]).find(x=>x.k===rot);
  return m ? {k:rot, v:m.v, d:m.d, periodo:r.periodo, compara:r.compara} : null;
}
function heroHTML(){
  const h=destaqueAtual(); if(!h) return '';
  const pct = (META && META>0) ? Math.max(0, Math.min(100, Math.round(h.v/META*100))) : null;
  const sobe = h.d==null ? null : h.d>0;
  return '<section class="hero'+(sobe===true?" up":(sobe===false?" down":""))+'">'+
    '<div class="hero-k">'+esc(h.k)+'<i>o foco do trabalho agora</i></div>'+
    '<div class="hero-v">'+numBR(h.v)+'</div>'+
    '<div class="hero-l">'+
      (h.d==null?'<span class="rs-d zero">sem comparação</span>'
               :'<span class="rs-d '+(h.d>0?"sobe":(h.d<0?"desce":"zero"))+'">'+
                 (h.d>0?"\u25B2":(h.d<0?"\u25BC":"\u2022"))+' '+(h.d>0?"+":"")+
                 String(Math.round(h.d*10)/10).replace(".",",")+'% em relação a '+esc(h.compara||"antes")+'</span>')+
      (h.novos!=null?'<span class="hero-x">'+(h.novos>0?"+":"")+numBR(h.novos)+' no mês</span>':'')+
    '</div>'+
    (pct!=null?'<div class="hero-meta"><div class="hero-bar"><i style="width:'+pct+'%"></i></div>'+
      '<span>'+numBR(h.v)+' de '+numBR(META)+' · '+pct+'% da meta</span></div>':'')+
    (RECADO?'<div class="hero-r"><span class="hero-asp">&#8220;</span>'+esc(RECADO)+'</div>':'')+
    (h.periodo?'<div class="hero-p">'+esc(h.periodo)+'</div>':'')+
  '</section>';
}
/* ---- resultados do mês (dados do Reportei, enviados pela MK3) ---- */
const numBR = n => (n==null||isNaN(n)) ? "-" : Number(n).toLocaleString("pt-BR");
function seta(d){
  if(d==null) return '<span class="rs-d zero">estável</span>';
  const p=Math.round(d*10)/10, cls=p>0?"sobe":(p<0?"desce":"zero");
  return '<span class="rs-d '+cls+'">'+(p>0?"\u25B2":(p<0?"\u25BC":"\u2022"))+' '+(p>0?"+":"")+String(p).replace(".",",")+'%</span>';
}
function resultados(){
  if(!RESULTADOS) return '';
  const ks=Object.keys(RESULTADOS).sort(); if(!ks.length) return '';
  const r=RESULTADOS[ks[ks.length-1]]; if(!r || !(r.metricas||[]).length) return '';
  return '<section class="bloco"><h2>Resultados do mês</h2>'+
    '<div class="res-ms">'+r.metricas.map(x=>
      '<div class="res-m"><span class="rs-v">'+numBR(x.v)+'</span>'+
      '<span class="rs-k">'+esc(x.k)+'</span>'+seta(x.d)+'</div>').join("")+'</div>'+
    (r.resumo?'<p class="nota">'+esc(r.resumo)+'</p>':'')+
    '<p class="nota">'+esc(r.periodo||"")+(r.compara?' · comparado com '+esc(r.compara):'')+'.</p>'+
  '</section>'+
  (r.dash?('<section class="bloco"><h2>Painel completo</h2>'+
    '<p class="nota">Todos os números do mês, direto da nossa ferramenta de relatórios. Atualiza sozinho. Role dentro do quadro para ver tudo.</p>'+
    '<div class="dash-box" id="dashBox">'+(DASH_ABERTO?dashFrameHTML(r.dash):
      '<button class="dash-abrir" id="dashAbrir">Carregar painel completo</button>'+
      '<a class="res-link" href="'+esc(r.dash)+'" target="_blank" rel="noopener">ou abrir em outra aba</a>')+
    '</div></section>'):'');
}
function dashFrameHTML(u){
  return '<div class="dash-carrega">Carregando o painel, isso leva alguns segundos...</div>'+
    '<iframe class="dash-fr" src="'+esc(u)+'" loading="lazy" title="Painel de resultados"></iframe>'+
    '<a class="res-link" href="'+esc(u)+'" target="_blank" rel="noopener">abrir em outra aba</a>';
}
function armarFrame(cx){
  const fr=cx.querySelector(".dash-fr"); if(!fr) return;
  fr.addEventListener("load",()=>{ const c=cx.querySelector(".dash-carrega"); if(c) c.remove(); fr.classList.add("pronto"); });
}
function ligarDash(){
  const cx=document.getElementById("dashBox"); if(!cx) return;
  if(DASH_ABERTO){ armarFrame(cx); return; }
  const b=document.getElementById("dashAbrir"); if(!b) return;
  b.onclick=()=>{
    const ks=Object.keys(RESULTADOS||{}).sort(); const r=RESULTADOS[ks[ks.length-1]]; if(!r||!r.dash) return;
    DASH_ABERTO=true; cx.innerHTML=dashFrameHTML(r.dash); armarFrame(cx);
  };
}
function caixaDia(){
  let cx=document.getElementById("diaModal");
  if(!cx){ cx=document.createElement("div"); cx.id="diaModal"; document.body.appendChild(cx); }
  cx.innerHTML=detalheDia();
  document.body.classList.toggle("travado", !!PDIA);
}
function desenhar(){
  $("view").innerHTML = heroHTML() + faltaVoce() + planoHTML() + cicloHTML() + esperando() + resultados() + proximos() + historico();
  ligarDash(); caixaDia();
}
/* navegacao do calendario e troca de visao, sem recarregar a pagina */
document.addEventListener("click", ev=>{
  const a=ev.target.closest("[data-pmes],[data-pvisao],[data-pdia]"); if(!a) return;
  ev.preventDefault();
  if(a.dataset.pmes!==undefined){ PMES=Number(a.dataset.pmes)||0; PDIA=null; }
  if(a.dataset.pdia!==undefined){
    if(a.classList.contains("dd-fundo") && ev.target!==a) return;   /* clique dentro da janela nao fecha */
    PDIA = (a.dataset.pdia && a.dataset.pdia!==PDIA) ? a.dataset.pdia : null;
  }
  if(a.dataset.pvisao){ PVISAO=a.dataset.pvisao; PDIA=null; }
  desenhar();
});
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape" && PDIA){ PDIA=null; caixaDia(); } });
desenhar();

/* ---- atualização automática: lê só o nó deste link no banco da MK3 ---- */
const URL_ESP = (typeof MK3_DB!=="undefined" && MK3_DB) ? (MK3_DB+"/painel/publico/"+MEU_TOKEN+".json") : null;


function marcarAtualizado(){
  let el=document.getElementById("atualiz");
  if(!el){ el=document.createElement("div"); el.id="atualiz"; el.className="atualiz";
    const f=document.querySelector("footer"); if(f) f.parentNode.insertBefore(el,f); else document.body.appendChild(el); }
  const h=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  el.innerHTML='<span class="pt"></span>Atualiza sozinho. Última leitura às '+h+'.';
}
function aplicarEspelho(v){
  if(!v || typeof v!=="object") return false;
  if(v.ativo && v.ativo!==MEU_TOKEN){ expirado(); return true; }
  const assinatura = JSON.stringify({c:v.concluidas,d:v.datas,r:v.resultados,a:v.ativo,p:v.pendencias,pl:v.plano});
  if(assinatura===ULTIMO){ marcarAtualizado(); return true; }   /* nada mudou: não redesenha */
  ULTIMO=assinatura;
  RESULTADOS = v.resultados || null; OBJETIVO = v.objetivo || ""; META = v.meta || null; RECADO = v.recado || ""; PENDENCIAS = v.pendencias || null; PLANO = v.plano || null;
  const E={concluidas:{},datas:{}};
  E.concluidas[CLIENTE_ID]=v.concluidas||[];
  E.datas[CLIENTE_ID]=v.datas||{};
  aplicarEstado(E); desenhar(); marcarAtualizado();
  return true;
}
function lerPublicado(){
  fetch("../../estado.json?ts="+Date.now())
    .then(r=>r.ok?r.json():null)
    .then(E=>{ if(!E) return; if(!linkValido(E)){ expirado(); return; } aplicarEstado(E); desenhar(); })
    .catch(()=>{});
}
function puxarEspelho(){
  if(!URL_ESP){ lerPublicado(); return; }
  fetch(URL_ESP+"?ts="+Date.now())
    .then(r=>r.ok?r.json():null)
    .then(v=>{ if(v && aplicarEspelho(v)){ TEM_ESPELHO=true; } else if(!TEM_ESPELHO){ lerPublicado(); } })
    .catch(()=>{ if(!TEM_ESPELHO) lerPublicado(); });
}
puxarEspelho();
if(URL_ESP && window.EventSource){
  try{
    FONTE=new EventSource(URL_ESP);
    FONTE.addEventListener("put",  ()=>puxarEspelho());
    FONTE.addEventListener("patch",()=>puxarEspelho());
    FONTE.onerror=()=>{ /* cai para a checagem periódica */ };
  }catch(e){}
}
setInterval(puxarEspelho, 60000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) puxarEspelho(); });
</script>
