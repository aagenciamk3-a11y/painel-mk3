<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MK3 — Painel de Prazos</title>
<style>
  :root{
    /* superfícies: elevação por luminosidade (dark mode) */
    --bg:#140E24; --side:#1C1430; --panel:#241A3D; --panel2:#2E2249; --sup4:#392B57;
    --line:#40325F;
    --txt:#F1EEFB; --mut:#B9B0D2; --dim:#8B85A0;
    /* marca */
    --mk3:#8B5CF6; --mk3s:#7C3AED; --mk3o:#F97316; --roxo:#A78BFA;
    /* status */
    --atrasado:#F2555A; --hoje:#FF8A3D; --umdia:#F5C518;
    --semana:#5AA3FF; --futuro:#8B85A0; --ok:#4CC463; --sem:#B57BFF;
    /* raio + sombra */
    --r1:8px; --r2:12px; --r3:16px;
    --sh1:0 1px 2px rgba(0,0,0,.30);
    --sh2:0 4px 12px rgba(0,0,0,.35);
    --sh3:0 16px 48px rgba(0,0,0,.55);
    --foco:#C4B5FD;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  :focus{outline:none}
  :focus-visible{outline:2px solid var(--foco);outline-offset:2px;border-radius:inherit}
  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  body{background:var(--bg);color:var(--txt);line-height:1.5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
  .app{display:flex;min-height:100vh}
  .main{flex:1 1 auto;min-width:0;padding:22px 28px 60px}
  .wrap{max-width:1180px;margin:0 auto}
  /* sidebar (estilo Pode Postar) */
  .side{width:232px;flex:none;background:var(--side);border-right:1px solid var(--line);
    padding:16px 12px 24px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .side-brand{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 14px;margin-bottom:4px;border-bottom:1px solid var(--line)}
  .side-brand .b{font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--txt)}
  .side-brand .b span{color:var(--mk3o)}
  .side-sec{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);font-weight:700;padding:14px 10px 6px}
  .snav{display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;color:var(--mut);
    font:inherit;font-size:14px;font-weight:500;padding:9px 10px;border-radius:9px;cursor:pointer;text-align:left;border-left:3px solid transparent}
  .snav:hover{background:rgba(255,255,255,.05);color:var(--txt)}
  .snav.on{background:rgba(139,92,246,.18);color:#fff;border-left-color:var(--mk3o)}
  .snav-i{width:22px;height:22px;flex:none;display:grid;place-items:center;color:inherit}
  .snav-i svg{width:19px;height:19px}
  .snav-t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .snav-b{background:var(--atrasado);color:#fff;font-size:10px;font-weight:700;border-radius:20px;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;flex:none}
  .side-toggle{background:none;border:1px solid var(--line);color:var(--mut);width:26px;height:26px;border-radius:7px;cursor:pointer;display:grid;place-items:center;font-size:11px}
  .side-toggle:hover{color:var(--txt);border-color:var(--mut)}
  .app.side-col .side{width:62px}
  .app.side-col .snav-t,.app.side-col .side-sec,.app.side-col .snav-b{display:none}
  .app.side-col .side-brand{justify-content:center}
  .app.side-col .snav{justify-content:center;gap:0;padding:9px 0;border-left-width:0}
  /* drag & drop (duplicar tarefa) */
  .bcard[data-drag]{cursor:grab}
  .bcard.dragging{opacity:.30;transform:scale(.98)}
  body.arrastando{cursor:grabbing}
  body.arrastando *{cursor:grabbing!important;user-select:none}
  .drag-ghost{position:fixed;z-index:3000;pointer-events:none;opacity:0;
    transform:rotate(-3deg) scale(.96);box-shadow:0 18px 40px rgba(0,0,0,.6);
    transition:opacity .12s ease,transform .16s cubic-bezier(.2,0,0,1)}
  .drag-ghost.on{opacity:.95;transform:rotate(-3deg) scale(1.03)}
  .bcol.dragno{outline:2px dashed var(--atrasado);outline-offset:-4px;background:rgba(242,85,90,.07)}
  .bcol.dragover,.bcol.dragno{transition:background .14s ease}
  @media (prefers-reduced-motion:no-preference){
    .bcard.dup{animation:entraCard .26s cubic-bezier(.2,0,0,1)}
    @keyframes entraCard{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
  }
  .bcol.dragover{outline:2px dashed var(--mk3o);outline-offset:-4px;background:rgba(249,115,22,.06)}
  .bcard.dup{border-style:dashed}
  .dup-badge{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:var(--mk3o);font-weight:700;margin-bottom:4px}
  .dup-x{background:none;border:none;color:var(--mut);cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
  .dup-x:hover{color:var(--atrasado)}
  header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}
  h1{font-size:22px;letter-spacing:-.02em}
  h1 span{color:var(--mut);font-weight:400}
  .hoje{font-size:13px;color:var(--mut)}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);margin:36px 0 14px;font-weight:600}

  /* ---- barra de áreas (filtro do topo) ---- */
  .areas{display:flex;gap:8px;margin-bottom:26px;flex-wrap:wrap}
  .areabtn{background:var(--panel);border:1px solid var(--line);color:var(--mut);font:inherit;
    font-size:14px;font-weight:600;padding:10px 20px;border-radius:11px;cursor:pointer;transition:.12s}
  .areabtn:hover{color:var(--txt);border-color:var(--mut)}
  .areabtn.on{background:var(--semana);border-color:var(--semana);color:#fff}

  /* ---- toggle de modos na home (ver todos os clientes) ---- */
  .modos{display:inline-flex;gap:2px;background:var(--panel);border:1px solid var(--line);
    border-radius:11px;padding:3px;margin-bottom:22px}
  .modos button{background:none;border:none;color:var(--mut);font:inherit;font-size:13px;font-weight:600;
    padding:8px 18px;border-radius:8px;cursor:pointer}
  .modos button:hover{color:var(--txt)}
  .modos button.on{background:var(--panel2);color:var(--txt)}

  /* ---- home: cards de cliente ---- */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
  .ccard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;cursor:pointer;text-align:left;color:inherit;font:inherit;padding:0;transition:.14s}
  .ccard:hover{border-color:var(--mut);transform:translateY(-2px)}
  .ccard-banner{height:84px;width:100%}
  .ccard-av,.cli-av2{position:relative;overflow:hidden}
  .ccard-av img,.cli-av2 img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .ccard-av{position:absolute;top:50px;left:18px;width:64px;height:64px;border-radius:16px;
    display:grid;place-items:center;font-size:21px;font-weight:700;color:#fff;
    border:3px solid var(--panel);letter-spacing:.02em}
  .ccard-body{padding:24px 18px 18px}
  .ccard-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
  .ccard-top h3{font-size:18px;letter-spacing:-.01em}
  .badge-ativo{background:rgba(167,139,250,.16);color:var(--roxo);font-size:11px;font-weight:600;
    padding:3px 11px;border-radius:20px;white-space:nowrap}
  .seg{display:inline-block;background:var(--panel2);border:1px solid var(--line);color:var(--mut);
    font-size:11px;font-weight:600;padding:3px 11px;border-radius:8px;margin-top:9px}
  .ccard-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
  .stat{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
    border-radius:9px;padding:9px 11px;font-size:12.5px;font-weight:600;color:var(--mut)}
  .stat i{width:8px;height:8px;border-radius:50%;flex:none}
  .stat b{color:var(--txt)}
  .s-atrasado i{background:var(--atrasado)} .s-atrasado b{color:var(--atrasado)}
  .s-hoje i{background:var(--hoje)}         .s-hoje b{color:var(--hoje)}
  .s-semana i{background:var(--semana)}     .s-semana b{color:var(--semana)}
  .s-ok i{background:var(--ok)}             .s-ok b{color:var(--ok)}

  /* ---- barra do cliente aberto ---- */
  .cli-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
  .voltar{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:9px;
    padding:9px 13px;font:inherit;font-size:13px;cursor:pointer}
  .voltar:hover{border-color:var(--semana);color:var(--semana)}
  .cli-title{display:flex;align-items:center;gap:11px;font-size:19px;font-weight:600}
  .cli-av2{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;
    font-weight:700;font-size:13px}
  .cli-tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
  .cli-tabs button{background:none;border:none;color:var(--mut);font:inherit;font-size:14px;font-weight:500;
    padding:9px 15px;border-radius:9px;cursor:pointer}
  .cli-tabs button:hover{color:var(--txt)}
  .cli-tabs button.on{background:var(--panel2);color:var(--txt)}

  /* ---- semáforo (dentro de Tarefas) ---- */
  .semaforo{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .sf{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;
    border-left:3px solid var(--futuro);cursor:pointer;transition:.12s;position:relative}
  .sf:hover{background:var(--panel2)}
  .sf.on{background:var(--panel2)}
  .sf.on::after{content:"\2713";position:absolute;top:9px;right:11px;font-size:11px;color:var(--mut)}
  .sf b{display:block;font-size:28px;line-height:1.1;font-weight:600}
  .sf small{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
  .sf.atrasado{border-left-color:var(--atrasado)} .sf.atrasado b{color:var(--atrasado)}
  .sf.hoje{border-left-color:var(--hoje)}         .sf.hoje b{color:var(--hoje)}
  .sf.umdia{border-left-color:var(--umdia)}       .sf.umdia b{color:var(--umdia)}
  .sf.semana{border-left-color:var(--semana)}     .sf.semana b{color:var(--semana)}
  .sf.sem{border-left-color:var(--sem)}           .sf.sem b{color:var(--sem)}
  .sf.ok{border-left-color:var(--ok)}             .sf.ok b{color:var(--ok)}

  /* ---- listas de tarefa ---- */
  .fila{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .row{display:grid;grid-template-columns:112px 1fr 128px 92px 32px;gap:14px;align-items:center;
    padding:13px 16px;border-top:1px solid var(--line);font-size:14px}
  .row:first-child{border-top:none}
  .row:hover{background:var(--panel2)}
  .tag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 7px;
    border-radius:5px;text-align:center;white-space:nowrap}
  .t-atrasado{background:rgba(229,72,77,.15);color:var(--atrasado)}
  .t-hoje{background:rgba(255,138,61,.15);color:var(--hoje)}
  .t-umdia{background:rgba(245,197,24,.15);color:var(--umdia)}
  .t-semana{background:rgba(76,154,255,.15);color:var(--semana)}
  .t-futuro{background:rgba(110,116,129,.15);color:var(--futuro)}
  .t-sem{background:rgba(168,85,247,.15);color:var(--sem)}
  .t-ok{background:rgba(63,185,80,.15);color:var(--ok)}
  .tag.okatraso{background:rgba(245,197,24,.16);color:var(--umdia)}
  .tarefa{font-weight:500}
  .tarefa em{display:block;font-style:normal;font-size:12px;color:var(--mut);margin-top:2px}
  .data{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
  .dow{color:#5d626d;font-size:11px}
  .resp{color:var(--mut);font-size:12px}
  .row.rowc{grid-template-columns:112px 1fr 140px 128px 92px 32px}
  .cli{color:var(--mut);font-size:13px}

  /* ---- calendário ---- */
  .cal-nav{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .cal-nav strong{font-size:16px;text-transform:capitalize;min-width:190px}
  .cal-nav button{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;
    width:32px;height:32px;cursor:pointer;font-size:15px;line-height:1}
  .cal-nav button:hover{border-color:var(--semana);color:var(--semana)}
  .cal-nav .hj{width:auto;padding:0 12px;font:inherit;font-size:12px;color:var(--mut)}
  .cal{background:transparent;border:none;overflow:visible}
  .cal-dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px;padding:0 2px}
  .cal-dow div{text-align:left;font-size:10px;text-transform:uppercase;
    letter-spacing:.09em;color:var(--mut);font-weight:700;min-width:0}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
  .cel{min-width:0;overflow:hidden;height:clamp(104px,15vh,142px);background:var(--panel);
    border:1px solid var(--line);border-radius:9px;
    padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:.12s}
  .cel:hover{border-color:var(--mut)}
  .cel.fds{background:rgba(255,255,255,.015)}
  .cel.fora{background:rgba(255,255,255,.01);border-color:rgba(42,47,58,.5)}
  .cel.sel{box-shadow:0 0 0 2px var(--semana);border-color:var(--semana)}
  .cel .n{display:flex;align-items:center;justify-content:center;width:22px;height:22px;
    font-size:13px;font-weight:600;color:var(--txt);font-variant-numeric:tabular-nums;
    border-radius:50%;flex:none}
  .cel.fora .n{color:#4a4f5a;font-weight:400}
  .cel.fora .ev,.cel.fora .mais{opacity:.4}
  .cel.hj .n{background:var(--semana);color:#fff;font-weight:700}
  .ev{min-width:0;max-width:100%;background:var(--panel2);border-left:3px solid var(--futuro);
    border-radius:5px;padding:4px 7px 5px;margin-bottom:3px;overflow:hidden;cursor:pointer}
  .ev-tt{font-size:10.5px;font-weight:600;line-height:1.25;color:var(--txt);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev-meta{display:flex;align-items:center;gap:4px;margin-top:2px;font-size:9px;color:var(--mut);
    text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev-dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--futuro)}
  .ev-atrasado{border-left-color:var(--atrasado);background:rgba(229,72,77,.10)} .ev-atrasado .ev-dot{background:var(--atrasado)}
  .ev-hoje{border-left-color:var(--hoje);background:rgba(255,138,61,.10)}       .ev-hoje .ev-dot{background:var(--hoje)}
  .ev-umdia{border-left-color:var(--umdia);background:rgba(245,197,24,.10)}     .ev-umdia .ev-dot{background:var(--umdia)}
  .ev-semana{border-left-color:var(--semana);background:rgba(76,154,255,.10)}   .ev-semana .ev-dot{background:var(--semana)}
  .ev-futuro{border-left-color:var(--futuro);background:var(--panel2)}
  .ev-sem{border-left-color:var(--sem);background:rgba(168,85,247,.10)}         .ev-sem .ev-dot{background:var(--sem)}
  .ev-ok{border-left-color:var(--ok);background:rgba(63,185,80,.10)}            .ev-ok .ev-dot{background:var(--ok)}
  .ev-marco{border-left-color:var(--ok);background:rgba(63,185,80,.16)}         .ev-marco .ev-dot{background:var(--ok)}
  .cel.fora .ev{opacity:.45}
  .mais{font-size:10px;color:var(--mk3o);font-weight:700;padding-left:5px;margin-top:auto;cursor:pointer}
  .mais:hover{text-decoration:underline}
  .diamodal{max-width:600px;max-height:82vh;display:flex;flex-direction:column}
  .dia-lista{overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin:2px 0 14px;padding-right:2px}
  .dia-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel2);
    border:1px solid var(--line);border-radius:8px;padding:8px 11px;cursor:pointer;color:inherit;font:inherit}
  .dia-item:hover{border-color:var(--mk3o)}
  .dia-item .tag{flex:none}
  .dia-t{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .dia-t i{font-style:normal;color:var(--mut);font-size:12px}
  .diamarco{font-size:12px;color:var(--ok);margin-bottom:12px;line-height:1.5}
  .calDia{margin-top:18px}

  /* ---- histórico ---- */
  .hist{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px 26px}
  .hist ol{list-style:none;position:relative;padding-left:26px}
  .hist ol::before{content:"";position:absolute;left:5px;top:7px;bottom:7px;width:2px;background:var(--line)}
  .hist li{position:relative;padding-bottom:20px}
  .hist li:last-child{padding-bottom:0}
  .hist li::before{content:"";position:absolute;left:-26px;top:5px;width:12px;height:12px;border-radius:50%;
    background:var(--bg);border:2px solid var(--futuro)}
  .hist li.feito::before{background:var(--ok);border-color:var(--ok)}
  .hist li.hj::before{background:var(--hoje);border-color:var(--hoje);box-shadow:0 0 0 4px rgba(255,138,61,.18)}
  .hist .qd{font-size:11px;color:var(--mut);text-transform:capitalize}
  .hist .tt{font-weight:600;font-size:14px}
  .hist .dt{font-size:12px;color:var(--mut)}
  .hist .prev{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--futuro);
    border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:7px}

  /* ---- atrasos ---- */
  .atr{display:grid;grid-template-columns:1fr 108px 108px 96px 88px;gap:14px;align-items:center;
    padding:13px 16px;border-top:1px solid var(--line);font-size:14px}
  .atr:first-child{border-top:none}
  .atr .etapa{font-weight:500}
  .atr .etapa em{display:block;font-style:normal;font-size:12px;color:var(--mut);margin-top:2px}
  .atr .n{font-weight:700;color:var(--atrasado);text-align:right;font-variant-numeric:tabular-nums}
  .quem{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    padding:4px 7px;border-radius:5px;text-align:center}
  .q-MK3{background:rgba(229,72,77,.15);color:var(--atrasado)}
  .q-Cliente{background:rgba(245,197,24,.15);color:var(--umdia)}
  .atr.prev{background:rgba(245,197,24,.05)} .atr.prev .n{color:var(--umdia)}
  .badge-prev{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
    background:rgba(245,197,24,.18);color:var(--umdia);padding:2px 6px;border-radius:4px;margin-left:7px}
  .atr.just{opacity:.72} .atr.just .n{color:var(--mut)}
  .badge-just{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
    background:rgba(139,144,156,.16);color:var(--mut);padding:2px 6px;border-radius:4px;margin-left:7px}
  .ok-prazo{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 22px;
    font-size:14px;color:var(--ok)}

  .vazio{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:22px;
    color:var(--mut);font-size:14px}
  footer{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
  
  
  

  /* ---- prioridades diárias ---- */
  .priohead{font-size:15px;font-weight:600;margin:2px 0 18px;display:flex;align-items:center;gap:10px}
  h2.prioh{display:flex;align-items:center;gap:10px;margin-top:30px}
  h2.prioh:first-of-type{margin-top:6px}
  .pcount{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:20px;
    background:var(--panel2);border:1px solid var(--line);color:var(--mut);font-size:12px;font-weight:700}
  .pcount.on{background:var(--atrasado);border-color:var(--atrasado);color:#fff}
  /* ---- quadro semanal (Prioridades) ---- */
  .semsel{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 18px}
  .semsel-l{font-size:12px;color:var(--mut);font-weight:600}
  .semsel-area{margin-left:auto;font-size:12px;font-weight:700;color:var(--mk3o);
    background:rgba(249,115,22,.12);border:1px solid rgba(249,115,22,.3);padding:5px 12px;border-radius:8px}

  /* ---- login por perfil + PIN ---- */
  .login{min-height:70vh;display:grid;place-items:center;padding:20px}

  /* ---- matriz de permissões ---- */
  /* ---- cartão de pessoa (equipe e permissões) ---- */

  /* ---- duas fotos no cartao ---- */

  .face-topo .card-face{width:26px;height:26px;font-size:10px;margin:0;border-color:rgba(255,255,255,.22)}
  .face-rodape{margin-left:auto;line-height:0}
  .face-rodape .card-face{width:26px;height:26px;font-size:10px;margin:0;border-color:rgba(255,255,255,.5)}
  .bcard-t{padding-right:32px}
  .bcard.st-ok .bcard-t{padding-right:32px}
  /* ---- links dos clientes ---- */
  .portais{max-width:560px}
  .po-lista{display:flex;flex-direction:column;gap:10px;margin:12px 0 14px}
  .po-row{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;
    display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;transition:border-color .14s}
  .po-row:hover{border-color:var(--mut)}
  .po-n{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
  .po-n .po-h{font-style:normal;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
    color:var(--mk3o);background:rgba(249,115,22,.14);border:1px solid rgba(249,115,22,.3);
    padding:2px 8px;border-radius:20px;white-space:nowrap}
  .po-acoes{display:flex;align-items:center;gap:6px;justify-self:end}
  .po-u{grid-column:1 / -1;width:100%;background:var(--panel);border:1px solid var(--line);color:var(--mut);
    border-radius:8px;padding:8px 10px;font:inherit;font-size:11.5px;font-family:ui-monospace,Menlo,monospace;
    text-overflow:ellipsis}
  .po-u:focus{border-color:var(--mk3);color:var(--txt)}
  .po-c,.po-a,.po-r{font:inherit;font-size:12px;font-weight:600;border-radius:8px;cursor:pointer;
    min-height:32px;padding:0 13px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;text-decoration:none}
  .po-c{background:var(--mk3);border:1px solid var(--mk3);color:#fff}
  .po-c:hover{background:var(--mk3s);border-color:var(--mk3s)}
  .po-a{background:var(--panel);border:1px solid var(--line);color:var(--mut)}
  .po-a:hover{border-color:var(--mk3o);color:var(--mk3o)}
  .po-r{background:none;border:1px solid rgba(242,85,90,.35);color:#FF9DA0}
  .po-r:hover{background:rgba(242,85,90,.14);border-color:var(--atrasado)}
  .po-x{font-size:11.5px;color:var(--mut);font-style:italic}
  .po-p{grid-column:1 / -1;font-size:11px;color:var(--mk3o);font-weight:600;
    background:rgba(249,115,22,.10);border:1px dashed rgba(249,115,22,.32);border-radius:8px;padding:6px 10px}
  .nota-p{font-size:11.5px;color:var(--mut);font-style:italic;margin-bottom:14px;line-height:1.5}
  /* ---- motivos pré-definidos ---- */
  .motivo-box{max-width:420px}
  .mot-lista{display:flex;flex-direction:column;gap:6px;margin:12px 0 14px}
  .mot{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel2);
    border:1px solid var(--line);border-radius:var(--r1);padding:10px 12px;cursor:pointer;color:var(--txt);
    font:inherit;font-size:13.5px;min-height:38px;transition:.12s}
  .mot:hover{border-color:var(--mut)}
  .mot i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none;position:relative;transition:.12s}
  .mot.on{border-color:var(--mk3);background:rgba(139,92,246,.14)}
  .mot.on i{border-color:var(--mk3)}
  .mot.on i::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--mk3)}
  .mbtns button[disabled]{opacity:.45;cursor:not-allowed}
  /* ---- tendência de atrasos ---- */
  .tend{display:flex;flex-direction:column;gap:14px}
  .tend-topo{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
  .tend-kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:15px 17px;
    box-shadow:var(--sh1)}
  .k-r{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);font-weight:700}
  .tend-kpi b{display:flex;align-items:baseline;gap:7px;font-size:30px;font-weight:700;line-height:1.15;margin:5px 0 3px}
  .tend-kpi b small{font-size:11.5px;font-weight:600;color:var(--mut)}
  .tend-kpi b.mk3{color:var(--atrasado)} .tend-kpi b.cli{color:var(--umdia)} .tend-kpi b.ab{color:var(--hoje)}
  .k-v{font-size:11.5px;font-weight:600}
  .k-v.melhor{color:var(--ok)} .k-v.pior{color:var(--atrasado)} .k-v.n{color:var(--mut)}
  .tend-cx{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:16px 18px;box-shadow:var(--sh1)}
  .tend-h{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;text-transform:uppercase;
    letter-spacing:.08em;color:var(--mut);font-weight:700;margin-bottom:14px}
  .leg{display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:11px;font-weight:600}
  .leg i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-left:6px}
  .leg i.mk3,.tg-b.mk3,.rk-bar i.mk3{background:var(--atrasado)}
  .leg i.cli,.tg-b.cli,.rk-bar i.cli{background:var(--umdia)}
  .tg{display:flex;align-items:flex-end;gap:10px;height:170px}
  .tg-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%}
  .tg-bars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:5px}
  .tg-b{width:26px;min-height:3px;border-radius:5px 5px 0 0;position:relative;transition:height .35s cubic-bezier(.2,0,0,1)}
  .tg-b i{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10.5px;
    font-weight:700;color:var(--txt)}
  .tg-m{font-size:11px;color:var(--mut);text-transform:capitalize;font-weight:600}
  .tg-col.atual .tg-m{color:var(--mk3o)}
  .rk{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px dashed var(--line);font-size:13px}
  .rk:first-of-type{border-top:none}
  .rk-n{width:130px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rk-bar{flex:1;height:9px;background:var(--panel2);border-radius:20px;overflow:hidden;display:flex}
  .rk-bar i{height:100%;display:block}
  .rk-v{width:44px;text-align:right;color:var(--mut);font-variant-numeric:tabular-nums;font-weight:600;flex:none}
  .tend-nota{font-size:11.5px;color:var(--mut);font-style:italic;line-height:1.5}
  @media(max-width:600px){ .rk-n{width:88px} .tg-b{width:18px} }
  /* ---- toast com desfazer (4.1) ---- */
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(140%);z-index:1500;
    display:flex;align-items:center;gap:14px;background:var(--sup4);border:1px solid var(--line);
    border-radius:var(--r2);padding:12px 14px 12px 18px;box-shadow:var(--sh3);font-size:13.5px;
    opacity:0;pointer-events:none;transition:transform .22s cubic-bezier(.2,0,0,1),opacity .22s}
  .toast.on{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
  .toast b{font-weight:600}
  .toast button{background:rgba(255,255,255,.10);border:1px solid var(--line);color:var(--txt);font:inherit;
    font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:var(--r1);cursor:pointer;min-height:28px}
  .toast button:hover{border-color:var(--mk3o);color:var(--mk3o)}
  /* ---- marcador salvo (J) ---- */
  .salvo{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ok);font-weight:600;
    opacity:0;transition:opacity .2s}
  .salvo.on{opacity:1}
  /* ---- estados vazios com ação (I / 4.5) ---- */
  .vaziox{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r2);
    padding:26px 22px;text-align:center}
  .vaziox h4{font-size:14.5px;font-weight:600;margin-bottom:5px}
  .vaziox p{font-size:13px;color:var(--mut);margin-bottom:14px}
  .vaziox button{background:var(--mk3);border:none;color:#fff;font:inherit;font-size:13px;font-weight:600;
    padding:9px 18px;border-radius:var(--r1);cursor:pointer;min-height:32px}
  .vaziox button:hover{background:var(--mk3s)}
  .bcol-vaziox{padding:14px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
  .bcol-vaziox span{display:block;font-size:11.5px;color:var(--dim);margin-bottom:8px;line-height:1.4}
  .bcol-vaziox button{display:inline-block;width:auto;max-width:100%;align-self:center;
    background:none;border:1px dashed var(--line);color:var(--mut);font:inherit;font-size:11.5px;
    font-weight:600;padding:7px 12px;border-radius:var(--r1);cursor:pointer;min-height:28px;
    text-align:center;line-height:1.3}
  .bcol-vaziox button:hover{border-color:var(--mk3o);color:var(--mk3o)}
  .bcol-vaziox button.atr{border-style:solid;border-color:rgba(242,85,90,.45);color:#FF9DA0;background:rgba(242,85,90,.10)}
  .bcol-vaziox button.atr:hover{border-color:var(--atrasado);color:#fff;background:rgba(242,85,90,.22)}
  .atr-lista{display:flex;flex-direction:column;gap:7px;max-height:46vh;overflow-y:auto;margin:4px 0 14px}
  .atr-item{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);
    border-radius:var(--r1);padding:8px 11px;text-align:left;color:inherit;font:inherit;cursor:pointer;width:100%}
  .atr-item:hover{border-color:var(--mk3o)}
  .atr-item .at-t{flex:1;min-width:0;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .atr-item .at-t i{font-style:normal;color:var(--mut);font-size:12px;font-weight:400}
  .atr-item .at-add{flex:none;font-size:11px;font-weight:700;color:var(--mk3o)}
  /* ---- ícone de status (2.3) ---- */
  .tag i.si{font-style:normal;margin-right:4px}
  /* ---- ação rápida na linha (4.1) ---- */
  .row-ok{background:none;border:1px solid var(--line);color:var(--mut);cursor:pointer;
    width:28px;height:28px;border-radius:var(--r1);display:grid;place-items:center;font-size:13px;flex:none}
  .row-ok:hover{border-color:var(--ok);color:var(--ok);background:rgba(76,196,99,.10)}
  /* ---- quadro semanal (5.2) ---- */
  .bcol-h .bcount{background:var(--panel);border:1px solid var(--line);color:var(--mut);font-size:10.5px;
    font-weight:700;border-radius:20px;padding:1px 7px;margin-left:6px}
  .bcol.hoje{position:relative}
  .bcol.hoje::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;
    background:var(--mk3o);border-radius:var(--r2) var(--r2) 0 0;z-index:2}
  .bcard-chk{gap:8px}
  .chk{width:28px;height:28px}
  .bcard.st-ok{padding:7px 10px;opacity:.85}
  .bcard.st-ok .bcard-c{display:none}
  .bcard.st-ok .bcard-t{font-size:12.5px;text-decoration:line-through;text-decoration-color:rgba(255,255,255,.35)}
  .bcard.st-ok .bcard-chk{margin-top:6px}
  .mover{background:none;border:1px solid var(--line);color:var(--mut);cursor:pointer;width:28px;height:28px;
    border-radius:var(--r1);display:grid;place-items:center;font-size:13px;flex:none}
  .mover:hover{border-color:var(--mk3o);color:var(--mk3o)}
  /* ---- atalhos (4.3) ---- */
  .kbd{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;
    border-radius:5px;padding:1px 6px;font-size:11px;font-family:ui-monospace,Menlo,monospace;color:var(--txt)}
  .atalhos{max-width:420px}
  .atalhos .at-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 0;
    border-top:1px dashed var(--line);font-size:13.5px}
  .atalhos .at-row:first-of-type{border-top:none}
  /* ---- ver mais (4.4) ---- */
  .vermais{width:100%;margin-top:10px;background:none;border:1px solid var(--line);color:var(--mut);font:inherit;
    font-size:12.5px;font-weight:600;padding:9px;border-radius:var(--r1);cursor:pointer;min-height:32px}
  .vermais:hover{border-color:var(--mk3o);color:var(--mk3o)}
  /* ---- editbar respiro ---- */
  #editbar{margin:2px 0 18px;gap:10px}
  /* ---- responsividade (7) ---- */
  @media(min-width:1441px){ .main{max-width:1600px} }
  @media(max-width:1024px){
    .side{width:64px;padding:14px 8px}
    .side .snav-t,.side .side-sec,.side .snav-b{display:none}
    .side .side-brand{justify-content:center}
    .side .snav{justify-content:center;gap:0;padding:10px 0;border-left-width:0}
    .side-toggle{display:none}
    .main{padding:18px 16px 56px}
    .bcol{min-width:190px}
  }
  @media(max-width:760px){
    .row{grid-template-columns:1fr 32px;row-gap:6px}
    .row .tag{grid-column:1} .row .data,.row .resp{grid-column:1;font-size:12px}
    .row .row-ok{grid-column:2;grid-row:1}
    .board{gap:10px}
    .bcol{min-width:78vw}
    .semsel{gap:6px}
    .semsel select{font-size:12.5px;padding:6px 8px}
  }
  @media(max-width:640px){
    .side{width:52px;padding:12px 4px}
    .main{padding:14px 10px 48px}
    .ctx-t{font-size:18px}
    .cards{grid-template-columns:1fr}
    /* calendário vira agenda: só dias com conteúdo */
    .cal-dow{display:none}
    .cal-grid{grid-template-columns:1fr;gap:8px}
    .cel{height:auto;min-height:0;flex-direction:column;padding:10px 12px}
    .cel:not(:has(.ev)):not(.hj){display:none}
    .cel.fora{display:none}
    .cel .n{width:auto;height:auto;border-radius:0;justify-content:flex-start;font-size:12px;color:var(--mut);margin-bottom:4px}
    .cel.hj .n{background:none;color:var(--mk3o)}
    .cel .ev-meta{display:flex}
    .semsel-area{margin-left:0}
    .mbox{padding:18px 16px}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="side" id="side" aria-label="Navegação principal"></nav>
  <main class="main">
    <header>
      <div id="ctx"></div>
      <div class="hoje" id="hoje"></div>
    </header>
    <div id="editbar"></div>
    <div id="view"></div>
    <footer>
      Regras do Manual de Processos Internos MK3 v1.0. Prazos de aprovação e produção contam
      <strong>dias úteis</strong>. Status recalculados a cada abertura da página.
    </footer>
  </main>
</div>

<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitulo"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="tip"></div>
<input type="file" id="fotoInput" accept="image/*" style="display:none">

<script src="dados.js"></script>
<script src="motor.js"></script>
</body>
</html>
